name: culinary-blog

services:
  postgres:
    image: postgres:16-alpine
    container_name: culinary-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-culinary_blog_dev}
      POSTGRES_USER: ${POSTGRES_USER:-culinary_blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-culinary_blog_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: culinary-blog-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: culinary-blog-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@culinaryblog.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-culinary_blog_admin}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infrastructure/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    container_name: culinary-blog-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-culinary_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-culinary_minio_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    container_name: culinary-blog-minio-init
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-culinary_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-culinary_minio_secret}
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -ec "
      ready=0;
      for attempt in $$(seq 1 60); do
        if mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-culinary_minio_admin} $${MINIO_ROOT_PASSWORD:-culinary_minio_secret}; then ready=1; break; fi;
        echo 'Dang cho MinIO khoi dong...';
        sleep 2;
      done;
      test $$ready -eq 1;
      mc mb myminio/culinary-blog --ignore-existing;
      mc anonymous set download myminio/culinary-blog;
      echo 'Khoi tao bucket culinary-blog voi policy public-read thanh cong.';
      exit 0;
      "

  seq:
    image: datalust/seq:latest
    container_name: culinary-blog-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: ${SEQ_ADMIN_PASSWORD_HASH:?Generate SEQ_ADMIN_PASSWORD_HASH in .env before starting Seq}
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seq_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: culinaryblog-api:latest
    container_name: culinary-blog-api
    restart: unless-stopped
    networks:
      default:
      proxy:
        aliases: [api-proxy]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-culinary_blog_dev};Username=${POSTGRES_USER:-culinary_blog};Password=${POSTGRES_PASSWORD:-culinary_blog_dev}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RedisConnection: redis:6379
      Redis__Host: redis
      Redis__Port: 6379
      Minio__Endpoint: http://minio:9000
      Minio__PublicUrl: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      Minio__AccessKey: ${MINIO_ROOT_USER:-culinary_minio_admin}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-culinary_minio_secret}
      Minio__BucketName: culinary-blog
      JwtSettings__Secret: ${JWT_SECRET:-A_Very_Long_And_Secure_Secret_Key_For_CulinaryBlog_API_Development}
      JwtSettings__Issuer: CulinaryBlogApi
      JwtSettings__Audience: CulinaryBlogClients
      JwtSettings__ExpiryMinutes: 15
      ClientApp__BaseUrl: ${CLIENT_BASE_URL:-http://localhost:3000}
      GoogleAuth__ClientId: ${GoogleAuth__ClientId:-}
      Cors__AllowedOrigins__0: ${CLIENT_BASE_URL:-http://localhost:3000}
      # OPS-01: máy sạch chạy compose phải tự có schema + dữ liệu mẫu
      Database__AutoMigrate: "true"
      SeedData__Enabled: ${SEED_DATA_ENABLED:-true}
      ReverseProxy__KnownProxies__0: 172.30.11.10
      Seq__ServerUrl: http://seq:5341
      # OPS-07: Seq nhận OTLP (trace + metric) ở /ingest/otlp
      OpenTelemetry__OtlpEndpoint: http://seq:5341/ingest/otlp
      # OPS-08: để trống Email__Host thì dùng MockEmailService (chỉ ghi log), điền đủ để gửi SMTP thật
      Email__Host: ${Email__Host:-}
      Email__Port: ${Email__Port:-587}
      Email__User: ${Email__User:-}
      Email__Password: ${Email__Password:-}
      Email__From: ${Email__From:-}
    ports:
      - "${API_PORT:-5000}:8080"
    volumes:
      # Ảnh lưu cục bộ (avatar, ảnh công thức khi MinIO không sẵn sàng) phải sống sót qua việc build lại container
      - uploads_data:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      seq:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: http://api:8080
        NEXT_PUBLIC_SITE_URL: ${CLIENT_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GoogleAuth__ClientId:-}
    image: culinaryblog-web:latest
    container_name: culinary-blog-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://api:8080
      NEXT_PUBLIC_APP_URL: ${CLIENT_BASE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SITE_URL: ${CLIENT_BASE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: culinary-blog-nginx
    restart: unless-stopped
    networks:
      default:
      proxy:
        ipv4_address: 172.30.11.10
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.30.11.0/24

volumes:
  postgres_data:
    name: culinary-blog-postgres-data
  pgadmin_data:
    name: culinary-blog-pgadmin-data
  minio_data:
    name: culinary-blog-minio-data
  redis_data:
    name: culinary-blog-redis-data
  uploads_data:
    name: culinary-blog-uploads-data
  seq_data:
    name: culinary-blog-seq-data
