name: culinary-blog

services:
  postgres:
    image: postgres:16-alpine
    container_name: culinary-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-culinary_blog_dev}
      POSTGRES_USER: ${POSTGRES_USER:-culinary_blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-culinary_blog_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: culinary-blog-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: culinary-blog-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@culinaryblog.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-culinary_blog_admin}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infrastructure/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: culinary-blog-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-culinary_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-culinary_minio_secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: culinary-blog-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-culinary_minio_admin} $${MINIO_ROOT_PASSWORD:-culinary_minio_secret}; do
        echo 'Dang cho MinIO khoi dong...';
        sleep 2;
      done;
      mc mb myminio/culinary-blog --ignore-existing;
      mc anonymous set download myminio/culinary-blog;
      echo 'Khoi tao bucket culinary-blog voi policy public-read thanh cong.';
      exit 0;
      "

  seq:
    image: datalust/seq:latest
    container_name: culinary-blog-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seq_data:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: culinaryblog-api:latest
    container_name: culinary-blog-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-culinary_blog_dev};Username=${POSTGRES_USER:-culinary_blog};Password=${POSTGRES_PASSWORD:-culinary_blog_dev}
      ConnectionStrings__Redis: redis:6379
      Minio__Endpoint: http://minio:9000
      Minio__PublicUrl: http://localhost:9000
      Minio__AccessKey: ${MINIO_ROOT_USER:-culinary_minio_admin}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-culinary_minio_secret}
      Minio__BucketName: culinary-blog
      JwtSettings__Secret: ${JWT_SECRET:-A_Very_Long_And_Secure_Secret_Key_For_CulinaryBlog_API_Development}
      JwtSettings__Issuer: CulinaryBlogApi
      JwtSettings__Audience: CulinaryBlogClients
      JwtSettings__ExpiryMinutes: 15
      ClientApp__BaseUrl: http://localhost:3000
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: culinaryblog-web:latest
    container_name: culinary-blog-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://api:8080
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: culinary-blog-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
    name: culinary-blog-postgres-data
  pgadmin_data:
    name: culinary-blog-pgadmin-data
  minio_data:
    name: culinary-blog-minio-data
  redis_data:
    name: culinary-blog-redis-data
  seq_data:
    name: culinary-blog-seq-data
